<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>テールゲートリフター・高所作業車 実在事例 選定一覧</title>
<style>
  :root{--bg:#f2f3f5;--card:#fff;--ink:#1a1a1a;--sub:#5f5f5f;--line:#e2e2e2;--tgl:#c0392b;--awp:#1558b0;}
  *{box-sizing:border-box;-webkit-text-size-adjust:100%;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic","Segoe UI",Meiryo,sans-serif;line-height:1.6;padding-bottom:40px;font-size:15px;}
  header{background:#fff;border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:10;}
  h1{font-size:16px;margin:0 0 4px;font-weight:700;}
  .meta{font-size:11.5px;color:var(--sub);margin:0;}
  .wrap{max-width:860px;margin:0 auto;padding:14px 12px 0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:0 0 16px;}
  .tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:5px;padding:2px 8px;margin-right:6px;}
  .tag.tgl{background:var(--tgl);} .tag.awp{background:var(--awp);}
  .ttl{font-size:16px;font-weight:700;margin:8px 0 8px;}
  .row{font-size:13.5px;margin:5px 0;}
  .k{color:var(--sub);font-weight:700;margin-right:4px;}
  .src{display:inline-block;margin-top:10px;background:#0b66c3;color:#fff !important;text-decoration:none;font-size:13px;font-weight:600;padding:9px 14px;border-radius:8px;word-break:break-all;}
  .src:active{opacity:.8;}
  .no{color:var(--sub);font-size:12px;}
  .foot{font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 16px;}
  .foot b{color:var(--ink);}
  footer{text-align:center;color:var(--sub);font-size:11px;padding:10px 16px 0;}
</style>
</head>
<body>
<header>
  <h1>テールゲートリフター・高所作業車 実在事例 選定一覧</h1>
  <p class="meta">出典：厚生労働省 職場のあんぜんサイト 労働災害事例／全件 原典確認済（HTTP 200）／2026-06-13</p>
</header>
<div class="wrap" id="list"></div>
<footer>限定共有用（検索非掲載）。各「▶ 原典ページを開く」で厚労省の出典に移動します。</footer>
<script>
var cases=[
 {n:"①",cls:"tgl",tag:"TGL",ttl:"昇降板と荷台の間に頭部をはさまれ（TGL操作起因）",no:"38",ym:"記載なし",
  gyo:"一般貨物自動車運送業／テールボードローダ付2トントラックでの箱荷の積み込み",
  jokyo:"下ろした昇降板に箱（長さ174cm・9kg）を6個載せて荷台後部に立て掛け、荷台後部のスイッチを押して昇降板を上昇させたところ、荷が既存の荷にぶつかり、スイッチを押したまま荷を確認していて、動き出した昇降板と荷台の間に頭部を挟まれ死亡（はさまれ、死亡1名）。リモコンは未使用。",
  yoin:"昇降板のすぐ近くで操作スイッチを押し、リモコンを使わず、昇降板を上昇させながら荷の状態を確認したこと（テールゲートリフターの操作が直接原因）。",
  taisaku:"TGL操作時は昇降板から離れてリモコンスイッチを使用する。荷の確認はスイッチを切ってから行う。荷台後部と昇降板の間に頭・手があるとき昇降板が動かない装置の設置を検討する。",
  url:"https://anzeninfo.mhlw.go.jp/anzen_pg/SAI_DET.aspx?joho_no=38"},
 {n:"②",cls:"tgl",tag:"TGL",ttl:"テールゲートから荷が落下し下敷き",no:"101281",ym:"記載なし",
  gyo:"陸上貨物取扱業／テールゲートを使った機械（1.2t）の積み降ろし",
  jokyo:"テールゲートで機械（1.2t）を積み降ろし中、トラックが後ろ向きに傾き、機械が落下して下敷きになった（飛来・落下、死亡1名）。",
  yoin:"テールゲートの最大積載荷重（1t）を超える荷（1.2t）を扱い、入口へ下る傾斜地に止め（修正治具未使用）後方が沈み込んだ。",
  taisaku:"荷降ろしは平坦な場所で行い、修正治具で水平にしてから降ろす。最大積載荷重を超える荷には使用しない。",
  url:"https://anzeninfo.mhlw.go.jp/anzen_pg/SAI_DET.aspx?joho_no=101281"},
 {n:"③",cls:"tgl",tag:"TGL",ttl:"テールゲート昇降装置で台車が倒れ激突",no:"101534",ym:"記載なし",
  gyo:"その他の道路貨物運送業／テールゲート昇降装置を用いた空台車の荷下ろし",
  jokyo:"昇降装置のストッパー解除時に荷台の商品入り台車（約200kg）が倒れ、昇降装置上の空台車に当たって被災者側へ倒れ込み、跳ね飛ばした（崩壊・倒壊、死亡1名）。",
  yoin:"積み荷（台車）の積載方法・作業手順が定められず崩れやすかった／約200kgの台車を単独作業で扱い支えきれなかった。",
  taisaku:"一人で困難な重量物は複数人で作業。積み荷の取扱い・荷積み／荷下ろし手順を定めて教育し実行させる。",
  url:"https://anzeninfo.mhlw.go.jp/anzen_pg/SAI_DET.aspx?joho_no=101534"},
 {n:"④",cls:"awp",tag:"高所作業車",ttl:"不安定な地盤で後方に転倒し激突",no:"101377",ym:"記載なし",
  gyo:"建設業／自走式高所作業車（最大作業床高さ約12m）での大木の枝切り",
  jokyo:"高さ10m以上の枝切り作業中に高所作業車が後方へ転倒し、バスケットの被災者が地面に激突（転倒、死亡1名）。",
  yoin:"凸凹で傾斜（右6度・左8度）のある不安定な仮通路に敷鉄板等を敷かず据え付け不同沈下／転倒警報音が出ても使用を停止しなかった。",
  taisaku:"水平かつ堅固な面に据え付ける。転倒警報音が出たら即座に使用を停止する。",
  url:"https://anzeninfo.mhlw.go.jp/anzen_pg/SAI_DET.aspx?joho_no=101377"},
 {n:"⑤",cls:"awp",tag:"高所作業車",ttl:"作業床手すりと上方構造物（橋桁下面）の間にはさまれ",no:"101270",ym:"記載なし",
  gyo:"橋梁建設工事業／高所作業車（作業床高さ14.8m）での橋桁型枠の解体",
  jokyo:"デッキ収納の操作を誤りブームが逆に伸び、デッキ操作盤の手すりと橋桁底部の間に身体を挟まれ、7日後に死亡（はさまれ・巻き込まれ、死亡1名）。",
  yoin:"デッキ収納の操作を誤った／作業床（デッキ）と橋桁底板の間隔（空間）が狭く、誤操作を是正する余裕がなかった。",
  taisaku:"作業床高さ2m以上の高所作業車は定期自主検査（特定自主検査）・作業開始前点検を確実に実施。運転は修了証を原本で確認した有資格者に行わせる。",
  url:"https://anzeninfo.mhlw.go.jp/anzen_pg/SAI_DET.aspx?joho_no=101270"},
 {n:"⑥",cls:"awp",tag:"高所作業車",ttl:"坂道で逸走し車体（アウトリガー）と側溝にはさまれ",no:"101412",ym:"記載なし",
  gyo:"その他の事業／坂道での電柱の点検補修のための高所作業車の設置",
  jokyo:"坂道（斜度11.5度）で設置中に車両が逸走し、止めようとした被災者が車両とともに坂道を下り、側溝に足を取られ転倒、アウトリガー底面と側溝の間に腹部を挟まれた（はさまれ、死亡1名）。エラー表示が出ていたが対応が周知されず。",
  yoin:"設置可能な路面斜度を超える坂道に設置／アウトリガーの格納手順を誤り車両がノーブレーキ状態で逸走。",
  taisaku:"路面斜度の適正範囲を周知し、超える場合は使用しない。設置時に車両がノーブレーキ状態にならないようにする（ブレーキ・逸走防止）。",
  url:"https://anzeninfo.mhlw.go.jp/anzen_pg/SAI_DET.aspx?joho_no=101412"}
];
var h="";
cases.forEach(function(c){
  h+='<div class="card">'
   +'<div><span class="tag '+c.cls+'">'+c.tag+'</span><span class="no">事例No.'+c.no+'</span></div>'
   +'<div class="ttl">'+c.n+' '+c.ttl+'</div>'
   +'<div class="row"><span class="k">発生年月</span>'+c.ym+'</div>'
   +'<div class="row"><span class="k">業種・作業</span>'+c.gyo+'</div>'
   +'<div class="row"><span class="k">発生状況</span>'+c.jokyo+'</div>'
   +'<div class="row"><span class="k">主な発生要因</span>'+c.yoin+'</div>'
   +'<div class="row"><span class="k">主な対策</span>'+c.taisaku+'</div>'
   +'<a class="src" href="'+c.url+'" target="_blank" rel="noopener">▶ 原典ページを開く（厚労省 あんぜんサイト）</a>'
   +'</div>';
});
h+='<div class="foot"><b>6件が別要因・別対策である根拠（要因／対策）</b><br>'
 +'① 昇降板の近くで操作・リモコン未使用・上昇させながら荷を確認（はさまれ）／昇降板から離れリモコン操作・スイッチを切って確認・はさまれ防止装置　<br>'
 +'② テールゲートの積載荷重超過・傾斜後傾／平坦水平で荷降ろし・積載荷重遵守　<br>'
 +'③ 台車の積載/取扱手順の欠如・単独作業／複数人・荷役手順の策定と教育　<br>'
 +'④ 不安定な傾斜地への据付(敷鉄板なし・不同沈下)・転倒警報無視／水平堅固な面への据付・警報で即停止　<br>'
 +'⑤ デッキ収納の操作ミス・上方構造物との離隔(空間)不足／定期自主検査・作業開始前点検・有資格原本確認　<br>'
 +'⑥ 設置可能斜度超の坂道設置・逸走(ブレーキ未確保)／路面斜度の適正範囲遵守・ブレーキ確保</div>';
document.getElementById("list").innerHTML=h;
</script>
</body>
</html>
