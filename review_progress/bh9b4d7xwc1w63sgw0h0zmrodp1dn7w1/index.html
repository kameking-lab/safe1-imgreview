<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>テールゲートリフター・高所作業車 重大事故事例集（v5 レビュー）</title>
<style>
  :root{--bg:#f2f3f5;--card:#fff;--ink:#1a1a1a;--sub:#6b6b6b;--line:#e2e2e2;--accent:#c00000;--blue:#1558b0;}
  *{box-sizing:border-box;-webkit-text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic","Segoe UI",Meiryo,sans-serif;line-height:1.5;padding-bottom:48px;}
  header{background:#fff;border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 14px 0;position:sticky;top:0;z-index:20;}
  h1{font-size:15px;margin:0 0 3px;font-weight:700;}
  .meta{font-size:11.5px;color:var(--sub);margin:0 0 10px;}
  .tabs{display:flex;gap:8px;}
  .tab{flex:1;text-align:center;text-decoration:none;font-size:14px;font-weight:700;padding:10px 6px;border-radius:8px 8px 0 0;color:#fff;}
  .tab.illust{background:var(--accent);}
  .tab.photo{background:var(--blue);}
  section{padding:14px 12px 0;max-width:860px;margin:0 auto;}
  .vh{font-size:17px;font-weight:700;margin:6px 0 10px;padding-left:8px;border-left:5px solid var(--accent);}
  .vh.blue{border-color:var(--blue);}
  .dl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;}
  .dl a{flex:1 1 46%;text-align:center;text-decoration:none;font-size:13px;font-weight:600;padding:11px 8px;border-radius:8px;}
  .pdf{background:#333;color:#fff !important;}
  .ppt{background:#1f7a3d;color:#fff !important;}
  .note{font-size:12px;color:var(--sub);margin:0 0 8px;}
  figure{margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  figcaption{font-size:12.5px;color:var(--sub);padding:8px 12px;border-bottom:1px solid var(--line);}
  figcaption b{color:var(--ink);margin-right:6px;}
  img{display:block;width:100%;height:auto;}
  .all{border:2px solid var(--accent);}
  .all.blue{border-color:var(--blue);}
  hr{border:none;border-top:8px solid #e6e7e9;margin:26px 0 0;}
  footer{text-align:center;color:var(--sub);font-size:11px;padding:18px 16px 0;}
</style>
</head>
<body>
<header>
  <h1>テールゲートリフター・高所作業車 重大事故事例集（v5）</h1>
  <p class="meta">(株)博展 御中／レビュー用・全17枚・2版／2026-06-13</p>
  <div class="tabs">
    <a class="tab illust" href="#illust">🎨 イラスト版</a>
    <a class="tab photo" href="#photo">📷 写真版</a>
  </div>
</header>

<section id="illust">
  <div class="vh">🎨 イラスト版（準写実カラー）</div>
  <div class="dl">
    <a class="pdf" href="./hakuten_jirei_illust_v5.pdf">📄 PDFを開く</a>
    <a class="ppt" href="./hakuten_jirei_illust_v5.pptx" download>⬇ PowerPoint(.pptx)</a>
  </div>
  <p class="note">📊 全スライド（1枚画像・スクロールで全17枚）</p>
  <figure><img class="all" src="./illust_v5_all.png" alt="イラスト版 全17枚連結" loading="eager"></figure>
  <p class="note">― 個別スライド ―</p>
  <div id="illust-list"></div>
</section>

<hr>

<section id="photo">
  <div class="vh blue">📷 写真版（写実写真）</div>
  <div class="dl">
    <a class="pdf" href="./hakuten_jirei_photo_v5.pdf">📄 PDFを開く</a>
    <a class="ppt" href="./hakuten_jirei_photo_v5.pptx" download>⬇ PowerPoint(.pptx)</a>
  </div>
  <p class="note">📊 全スライド（1枚画像・スクロールで全17枚）</p>
  <figure><img class="all blue" src="./photo_v5_all.png" alt="写真版 全17枚連結" loading="lazy"></figure>
  <p class="note">― 個別スライド ―</p>
  <div id="photo-list"></div>
</section>

<footer>このページは限定共有用です（検索非掲載）。</footer>
<script>
  var titles=["表紙","統計｜TGL災害","統計｜高所作業車",
    "事例① 昇降板からの墜落(概要)","事例① 表","事例② 昇降中のはさまれ(概要)","事例② 表",
    "事例③ カゴ車の転倒・下敷き(概要)","事例③ 表","事例④ バケットからの墜落(概要)","事例④ 表",
    "事例⑤ 走行・旋回中の転倒(概要)","事例⑤ 表","事例⑥ 上方構造物とのはさまれ(概要)","事例⑥ 表",
    "現場チェックリスト","出典・参考資料"];
  function fill(id,prefix){
    var h="";
    for(var i=1;i<=17;i++){
      var n=(i<10?"0":"")+i;
      h+='<figure><figcaption><b>'+n+'</b>'+titles[i-1]+'</figcaption>'+
         '<img src="./'+prefix+n+'.png" alt="'+n+'" loading="lazy"></figure>';
    }
    document.getElementById(id).innerHTML=h;
  }
  fill("illust-list","i");
  fill("photo-list","p");
</script>
</body>
</html>
